<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listing Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <button class="new" id="newrun">New run</button>
  <div class="history" id="jobs"></div>
  <div class="sidefoot">
    <span id="spend" class="meter" hidden></span>
    <span id="mode" class="meter">checking</span>
    <form method="post" action="/logout" id="logoutform" hidden>
      <button class="quiet" type="submit">Sign out</button>
    </form>
  </div>
</aside>

<main class="main">
  <header class="top">
    <button class="icon" id="toggleside" aria-label="Toggle runs">☰</button>
    <span class="title" id="threadtitle">Listing Forge</span>
  </header>

  <div class="thread" id="thread">
    <div class="intro" id="intro">
      <h1>What are we photographing?</h1>
      <p>Describe a product and it gets made from nothing, or attach a photo or
         CAD file to work from the real thing.</p>
      <div class="chips">
        <button class="chip" data-say="a matte charcoal linen cushion cover, 45cm square, hidden zip">A charcoal linen cushion cover</button>
        <button class="chip" data-say="a stonewashed sand cotton duvet set on a made bed, UK bedroom">A sand cotton duvet set</button>
        <button class="chip" data-say="a grey cheetah print duvet set on a made bed in a modern UK bedroom">A grey cheetah print duvet set</button>
      </div>
    </div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <input type="file" id="files" multiple hidden
             accept=".stl,.obj,.ply,.glb,.gltf,.off,.3mf,.step,.stp,.iges,.igs,.png,.jpg,.jpeg,.webp,.tif,.tiff">
      <button class="icon attach" id="attach" title="Attach a photo or CAD file">+</button>
      <textarea id="box" rows="1" placeholder="Describe a product, or say what to change"></textarea>
      <button class="send" id="send" aria-label="Send">↑</button>
    </div>
    <p class="pending" id="attached" hidden></p>
    <p class="fineprint">Images cost money to make. Check colours against the real product before listing.</p>
  </div>
</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="icon lb-close" id="lbclose" aria-label="Close">✕</button>
  <img id="lbimg" alt="">
</div>

<script src="/app.js"></script>
</body>
</html>
